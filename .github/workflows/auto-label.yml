name: Auto Label Issues
on:
  issues:
    types: [opened]
jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Auto-label based on keywords
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title.toLowerCase();
            const body = (context.payload.issue.body || "").toLowerCase();
            const text = title + " " + body;
            const labels = [];
            if (text.includes("bug") || text.includes("error") || text.includes("broken") || text.includes("fix")) {
              labels.push("bug");
            }
            if (text.includes("how") || text.includes("help") || text.includes("question") || text.includes("why")) {
              labels.push("question");
            }
            if (text.includes("feature") || text.includes("request") || text.includes("add") || text.includes("enhancement")) {
              labels.push("enhancement");
            }
            if (text.includes("docs") || text.includes("documentation") || text.includes("readme")) {
              labels.push("documentation");
            }
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: labels
              });
            }
